name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # vite 8.3.1 cần >=22.12.0
          cache: 'npm'
      - run: npm ci
      - run: npm test            # 6 self-check, chặn deploy lỗi âm thầm
      - run: npm run build
      # Pages site phải tạo tay 1 lần: Settings > Pages > Source = GitHub Actions.
      # GITHUB_TOKEN không tạo được Pages site (enablement: true luôn fail 403), đừng bật lại.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4